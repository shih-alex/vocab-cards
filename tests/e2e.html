<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字卡 e2e</title>
<style>
  body { margin: 16px; background: #FAFAF9; color: #1F2328;
         font: 13px/1.55 ui-monospace, Consolas, "Microsoft JhengHei", monospace; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #out { white-space: pre-wrap; margin: 0 0 16px; }
  #out.pass { color: #2E6B3A; }
  #out.fail { color: #9B1C1C; }
  #stage iframe { display: block; width: 390px; height: 844px; border: 1px solid #E7E5E4; }
</style>
</head>
<body>
<h1>單字卡 end-to-end</h1>
<pre id="out">RUNNING</pre>
<div id="stage"></div>
<script>
/*
 * End-to-end tests: the real app (../index.html) runs in a same-origin iframe with a fresh
 * localStorage key (?sk=…) per test. Tests drive the UI through the data-action hooks and
 * the window.VCApp API; app time is fixed with VCApp.setClock and quiz / shuffle randomness
 * with VCApp.setRandom(VC.seededRng(n)).
 * Writes "RESULT: PASS n FAIL m" (+ failure details) into <pre id="out"> and the title.
 * Run headless via tests/run_tests.py, or open http://…/tests/e2e.html in a browser to watch.
 * Add ?only=<text> to run only the tests whose name contains <text>.
 */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ harness */
  const out = document.getElementById('out');
  const stage = document.getElementById('stage');
  const RUN_ID = Date.now().toString(36);
  const TEST_TIMEOUT = 30000;

  const tests = [];
  const summary = [];
  const failures = [];
  let pass = 0;
  let fail = 0;
  let current = '';

  function test(name, fn) { tests.push({ name: name, fn: fn }); }

  function stable(v) {
    if (v === undefined) return 'undefined';
    if (typeof v === 'number' && !isFinite(v)) return String(v);
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  }

  function record(okay, label, detail) {
    if (okay) { pass++; return; }
    fail++;
    failures.push({ name: current, label: label || '', detail: detail || '' });
  }

  function eq(actual, expected, label) {
    const a = stable(actual);
    const b = stable(expected);
    record(a === b, label, 'expected: ' + b + '\nactual:   ' + a);
  }

  function ok(cond, label, detail) { record(!!cond, label, detail || 'condition is false'); }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function waitFor(pred, label, timeout) {
    const limit = timeout || 5000;
    const t0 = performance.now();
    for (;;) {
      let v = false;
      try { v = pred(); } catch (e) { v = false; }
      if (v) return v;
      if (performance.now() - t0 > limit) throw new Error('timed out waiting for: ' + label);
      await sleep(20);
    }
  }

  /* --------------------------------------------------------------- app access */
  let frame = null;
  let appErrors = [];
  let runCount = 0;
  let clockMs = null;

  const W = () => frame.contentWindow;
  const D = () => frame.contentDocument;
  const $ = (sel) => D().querySelector(sel);
  const $$ = (sel) => Array.prototype.slice.call(D().querySelectorAll(sel));
  const act = (name) => $('[data-action="' + name + '"]');
  const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : null);
  const S = () => W().VCApp.getState();
  const VC = () => W().VC;

  /** Load the app in a brand-new iframe (fresh session history) with its own storage key. */
  async function openApp(opts) {
    const o = opts || {};
    runCount++;
    const sk = o.sk || 'e2e-' + RUN_ID + '-' + runCount;
    if (!o.keep) localStorage.removeItem(sk);
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.title = 'app';
    frame.src = '../index.html?sk=' + encodeURIComponent(sk) + (o.hash || '');
    const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
    stage.appendChild(frame);
    await loaded;
    await waitFor(() => W().VCApp && $('main.screen'), 'app boot');
    appErrors = [];
    if (/debug/.test(location.search)) {
      // e2e.html?debug: log every history call of the app into localStorage['e2e-log'].
      const log = (m) => localStorage.setItem('e2e-log', (localStorage.getItem('e2e-log') || '') + current + ' :: ' + m + '\n');
      const hb = W().history.back.bind(W().history);
      const hg = W().history.go.bind(W().history);
      const hp = W().history.pushState.bind(W().history);
      W().history.back = () => { log('back from ' + W().location.hash + ' len ' + W().history.length); hb(); };
      W().history.go = (d) => { log('go ' + d + ' from ' + W().location.hash); hg(d); };
      W().history.pushState = (a, b, c) => { log('push ' + JSON.stringify(a) + ' len ' + W().history.length); hp(a, b, c); };
      W().addEventListener('hashchange', () => log('hashchange ' + W().location.hash + ' len ' + W().history.length));
    }
    W().addEventListener('error', (e) => appErrors.push(String(e.message || e)));
    W().addEventListener('unhandledrejection', (e) => appErrors.push('unhandled rejection: ' + String(e.reason)));
    if (o.clock != null) setClock(o.clock);
    return sk;
  }

  /** Set the app clock (ms) and re-render. */
  function setClock(ms) {
    clockMs = ms;
    W().VCApp.setClock(() => clockMs);
    W().VCApp.render();
  }

  /** Make quiz questions, answer order and the flashcard shuffle reproducible. */
  function seedRandom(n) { W().VCApp.setRandom(VC().seededRng(n)); }

  function click(target, label) {
    const el = typeof target === 'string' ? act(target) : target;
    if (!el) throw new Error('missing element: ' + (label || target));
    if (el.disabled) throw new Error('element is disabled: ' + (label || target));
    el.click();
  }

  function setValue(el, value, label) {
    if (!el) throw new Error('missing input: ' + (label || ''));
    el.value = value;
    el.dispatchEvent(new (W().Event)('input', { bubbles: true }));
    el.dispatchEvent(new (W().Event)('change', { bubbles: true }));
  }

  function key(k, extra) {
    const ev = new (W().KeyboardEvent)('keydown', Object.assign({ key: k, bubbles: true, cancelable: true }, extra || {}));
    D().body.dispatchEvent(ev);
  }

  /** A key pressed while el has the focus (e.g. Enter in the spelling box). */
  function keyOn(el, k) {
    el.dispatchEvent(new (W().KeyboardEvent)('keydown', { key: k, bubbles: true, cancelable: true }));
  }

  /** One touch event at (x, y): a real TouchEvent when the browser can make one, else an Event with .touches. */
  function touchEvent(el, type, x, y) {
    const w = W();
    const pts = type === 'touchend' || type === 'touchcancel' ? [] : [{ x: x, y: y }];
    let ev;
    try {
      const mk = (p) => new w.Touch({ identifier: 1, target: el, clientX: p.x, clientY: p.y });
      ev = new w.TouchEvent(type, { bubbles: true, cancelable: true, touches: pts.map(mk), changedTouches: [mk({ x: x, y: y })] });
    } catch (e) {
      ev = new w.Event(type, { bubbles: true, cancelable: true });
      Object.defineProperty(ev, 'touches', { value: pts.map((p) => ({ clientX: p.x, clientY: p.y })) });
    }
    el.dispatchEvent(ev);
  }

  /** A finger moving dx / dy pixels over el (in a few steps) and lifting. */
  async function swipe(el, dx, dy) {
    if (!el) throw new Error('missing swipe target');
    const r = el.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    touchEvent(el, 'touchstart', x0, y0);
    for (let i = 1; i <= 4; i++) touchEvent(el, 'touchmove', x0 + dx * i / 4, y0 + dy * i / 4);
    touchEvent(el, 'touchend', x0 + dx, y0 + dy);
    await sleep(10);
  }

  /** Replace speech output with a recorder; null when this browser has no speech synthesis. */
  function stubSpeech() {
    const synth = W().speechSynthesis;
    if (!synth || !W().SpeechSynthesisUtterance) return null;
    const spoken = [];
    synth.speak = (u) => { spoken.push(u.text); };
    synth.cancel = () => {};
    return spoken;
  }

  const screenName = () => { const m = $('main.screen'); return m && m.getAttribute('data-screen'); };
  const sheetOpen = () => $('.overlay[data-overlay="sheet"]:not(.closing)');
  const modalOpen = () => $('.overlay[data-overlay="modal"]:not(.closing)');
  const toasts = () => $$('#toasts .toast').map(text);

  async function onScreen(name) {
    await waitFor(() => screenName() === name && !$('.overlay'), 'screen ' + name);
    await sleep(30);
  }

  /** Wait until every overlay is gone and the app's history.back() calls have landed. */
  async function overlaysGone() {
    await waitFor(() => !$('.overlay'), 'overlays to close');
    await sleep(120);
  }

  async function openSheetBy(action) {
    click(action);
    await waitFor(sheetOpen, 'sheet after ' + action);
    await sleep(60);
  }

  async function modalAnswer(okay) {
    const m = await waitFor(modalOpen, 'modal dialog');
    await sleep(40);
    const title = text(m.querySelector('h3'));
    click(m.querySelector('[data-action="' + (okay ? 'modal-ok' : 'modal-cancel') + '"]'), okay ? 'modal-ok' : 'modal-cancel');
    await waitFor(() => !m.isConnected || m.classList.contains('closing'), 'modal to close');
    await sleep(60);
    return title;
  }

  /** Capture <a download> clicks (Blob URLs) instead of downloading. */
  function captureDownloads() {
    const w = W();
    const captured = [];
    const blobs = new Map();
    const create = w.URL.createObjectURL.bind(w.URL);
    w.URL.createObjectURL = function (blob) { const u = create(blob); blobs.set(u, blob); return u; };
    const nativeClick = w.HTMLElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () {
      if (this.hasAttribute('download')) {
        captured.push({ name: this.getAttribute('download'), blob: blobs.get(this.href) });
        return undefined;
      }
      return nativeClick.call(this);
    };
    return captured;
  }

  /**
   * Fill this origin's localStorage (shared with the app iframe) until only about freeChars
   * characters are left. Returns a function that removes the filler again — call it in finally.
   */
  function fillStorage(freeChars) {
    const keys = [];
    let size = 1 << 20;
    while (size >= 256) {
      const k = 'e2e-fill-' + RUN_ID + '-' + keys.length;
      try { localStorage.setItem(k, 'x'.repeat(size)); keys.push({ k: k, size: size }); } catch (e) { size >>= 1; }
    }
    let freed = 0;
    for (let i = keys.length - 1; i >= 0 && freed < freeChars; i--) {
      localStorage.removeItem(keys[i].k);
      freed += keys[i].size;
      keys.splice(i, 1);
    }
    return () => keys.forEach((x) => localStorage.removeItem(x.k));
  }

  function storageEvent(sk, value) {
    localStorage.setItem(sk, value);
    W().dispatchEvent(new (W().StorageEvent)('storage', { key: sk, newValue: value, storageArea: W().localStorage }));
  }

  function setFiles(input, files) {
    const dt = new (W().DataTransfer)();
    files.forEach((f) => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new (W().Event)('change', { bubbles: true }));
  }

  const makeFile = (parts, name, type) => new (W().File)(parts, name, { type: type || 'text/plain' });

  function utf16le(s) {
    const b = new Uint8Array(2 + s.length * 2);
    b[0] = 0xff; b[1] = 0xfe;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      b[2 + 2 * i] = c & 255;
      b[3 + 2 * i] = c >> 8;
    }
    return b;
  }

  /* ----------------------------------------------------------- state helpers */
  const deckNamed = (s, name) => s.decks.find((d) => d.name === name);
  const cardsOf = (s, deckId) => s.cards.filter((c) => c.deckId === deckId).sort((a, b) => a.seq - b.seq);
  const cardWord = (s, w) => s.cards.find((c) => c.word === w);
  const FIELDS = ['word', 'phonetic', 'meaning', 'example', 'exampleZh', 'note'];
  const fieldsOf = (c) => { const o = {}; FIELDS.forEach((k) => { o[k] = c[k]; }); return o; };
  const totalOf = (s, k) => s.cards.reduce((n, c) => n + c[k], 0);

  function seedSample() {
    const sample = W().VC_SAMPLE;
    const res = W().VCApp.importText(sample.text, { deckName: sample.name });
    return deckNamed(S(), sample.name) && res;
  }

  /* ---------------------------------------------------------------- fixtures */
  const NOW = new Date();
  const at = (day, h, m) => new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() + day, h, m || 0, 0).getTime();
  const T0 = at(0, 10);           // today 10:00 local (fixed for each test)
  const MIN = 60000;
  const DAY = 86400000;

  const WORDS = [
    ['apple', '蘋果'], ['bridge', '橋'], ['candle', '蠟燭'], ['desert', '沙漠'], ['engine', '引擎'],
    ['forest', '森林'], ['garden', '花園'], ['harbor', '港口'], ['island', '島嶼'], ['jungle', '叢林'],
    ['kettle', '水壺'], ['ladder', '梯子'], ['meadow', '草地'], ['needle', '針'], ['orange', '柳橙'],
    ['pencil', '鉛筆'], ['quarry', '採石場'], ['river', '河流'], ['saddle', '馬鞍'], ['temple', '寺廟'],
    ['umbrella', '雨傘'], ['valley', '山谷'], ['window', '窗戶'], ['yogurt', '優格'], ['zipper', '拉鍊'],
  ];

  function wordsText(n) {
    return WORDS.slice(0, n).map((p) => p[0] + ' | n. ' + p[1] + ' | The ' + p[0] + ' is here. | ' + p[1] + '在這裡。').join('\n');
  }

  async function importWords(n, deckName) {
    W().VCApp.importText(wordsText(n), { deckName: deckName });
    await sleep(20);
    return deckNamed(S(), deckName).id;
  }

  /** Home → the deck's hub (#/deck/<id>). */
  async function openDeck(deckId) {
    click($('[data-action="deck-open"][data-deck-id="' + deckId + '"]'), 'deck-open ' + deckId);
    await onScreen('deck');
  }

  /** Any screen → the deck's hub through the address bar (no history.back() afterwards!). */
  async function hubVia(deckId) {
    W().location.hash = '#/deck/' + encodeURIComponent(deckId);
    await onScreen('deck');
  }

  // Flashcards
  const flashWord = () => text($('#flash-card .card-front .word'));
  const flashProgress = () => text($('#flash-progress'));
  const flipped = () => !!$('#flash-card .card-back');

  // Quiz
  const quizCount = () => text($('#quiz-count'));
  const quizCardId = () => { const p = $('.quiz-prompt[data-card-id], .quiz-card[data-card-id]'); return p && p.getAttribute('data-card-id'); };
  const quizCard = () => S().cards.find((c) => c.id === quizCardId());
  const optTexts = () => $$('.opt .opt-text').map((el) => el.textContent);
  const flat = (m) => String(m).replace(/\s*\n\s*/g, '；');
  const correctIndex = () => optTexts().indexOf(flat(quizCard().meaning));
  const wrongIndex = () => (correctIndex() + 1) % $$('.opt').length;

  function noAppErrors() {
    eq(appErrors, [], 'no uncaught errors inside the app');
  }

  /* =================================================================== tests */

  test('empty state → load sample deck', async function () {
    const sk = await openApp({ clock: T0 });
    eq(screenName(), 'home', 'starts on home');
    ok($('.empty'), 'empty state shown');
    ok(act('empty-import-file') && act('empty-paste') && act('load-sample'), 'empty state offers 匯入文字檔 / 貼上文字 / 載入範例牌組');
    ok(!act('open-import'), 'no bottom import bar on the empty state');
    eq(text(act('load-sample')), '載入範例牌組', 'sample button label');

    click('load-sample');
    await waitFor(() => $$('.deck-row').length === 1, 'deck row after loading sample');
    const s = S();
    const sample = W().VC_SAMPLE;
    eq(s.version, 2, 'data format version 2');
    eq(s.decks.length, 1, 'one deck');
    eq(s.decks[0].name, sample.name, 'deck named after the sample');
    eq(s.cards.length, 40, '40 sample cards');
    eq(cardsOf(s, s.decks[0].id)[0].word, 'abandon', 'import order kept (first card)');
    eq([s.decks[0].settings, s.decks[0].flash, s.decks[0].lastQuiz], [{ direction: 'en2zh' }, { index: 0, shuffle: false, seed: 0 }, {}],
      'deck defaults: 字卡正面 英文, first flashcard, no quiz yet');
    eq(Object.keys(s.cards[0]).sort(), ['created', 'deckId', 'example', 'exampleZh', 'id', 'meaning', 'note', 'phonetic', 'right', 'seq', 'word', 'wrong'],
      'card fields: no spaced-repetition fields');
    eq([totalOf(s, 'right'), totalOf(s, 'wrong')], [0, 0], 'no quiz answers yet');
    eq(s.prefs.quizCount, 10, '10 questions per quiz by default');
    ok(!('days' in s), 'no day statistics');
    const row = $('.deck-row');
    eq(text(row.querySelector('.deck-name')), sample.name, 'row shows the deck name');
    eq(text(row.querySelector('.deck-total')), '共 40 字', 'total');
    ok(!row.querySelector('.deck-scores'), 'no quiz scores yet');
    ok(!$('#today-line'), 'no today / streak line');
    ok(toasts().some((t) => t.indexOf('已載入範例牌組（40 張）') >= 0), 'toast confirms the sample', JSON.stringify(toasts()));
    ok(act('open-import'), 'bottom 「＋ 匯入單字」 button');
    eq(text(act('open-import')), '匯入單字', 'import button label');
    await sleep(350);
    eq(JSON.parse(localStorage.getItem(sk)).cards.length, 40, 'saved to localStorage[sk]');
    eq(VC().quizEligible(s.cards), { choice: 40, spell: 40 }, 'every sample card makes a choice and a spelling question');
    eq(s.cards.filter((c) => VC().makeCloze(c) === null).map((c) => c.word), [], 'every sample example contains its word');
    noAppErrors();
  });

  test('empty-state shortcuts open the import screen', async function () {
    await openApp({ clock: T0 });
    click('empty-paste');
    await onScreen('import');
    ok($('#import-text'), 'paste textarea');
    ok($('#file-input') && $('#file-input').multiple, 'multi-file picker');
    eq($('#file-input').getAttribute('accept'), '.txt,.tsv,.csv,.md,.json,text/plain,text/markdown', 'accepted file types');
    ok(act('import-confirm').disabled, 'import disabled while empty');
    ok($('details.help') && act('copy-example'), 'format help + copy example');
    click('back');
    await onScreen('home');
    ok($('.empty'), 'back to the empty home');
    ok(!$('.empty-ios'), 'no iPhone hint on other browsers');
    click('empty-claude');
    await onScreen('import');
    ok(act('copy-claude-rules'), '「請 Claude 幫你做」 opens the import screen with the Claude prompt (UX-5)');
    noAppErrors();
  });

  const MULTI = [
    '# 測試檔',
    'alpha | /ˈælfə/ | n. 阿爾法 | Alpha comes first. | 阿爾法排第一。',
    'beta | n. 貝塔',
    'this line has no separator',
    ' | 缺單字',
    '#deck: 動物',
    'cat | /kæt/ | n. 貓',
    'dog | n. 狗 | The dog barked. | 狗叫了。 | 備註文字',
    'Cat | n. 貓（重複）',
    '#deck: 範例・高中常用單字',
    'abandon | v. 放棄（新）',
    'zebra crossing | n. 斑馬線',
  ].join('\n');

  test('paste import: #deck sections, duplicates, error lines', async function () {
    await openApp({ clock: T0 });
    seedSample();
    await waitFor(() => act('open-import'), 'home with decks');
    click('open-import');
    await onScreen('import');
    setValue($('#import-text'), MULTI, 'paste area');

    eq(text($('#import-summary')), '可匯入 5 張 · 重複 1 張 · 無法辨識 2 行', 'live summary');
    ok(/有 1 行是重複出現的單字，已合併/.test(text($('#import-preview'))), 'a word repeated in the file is reported as merged (P5)');
    eq(text(act('import-confirm')), '匯入 5 張', 'confirm button counts');
    const secs = $$('.sections li').map((li) => [text(li.querySelector('.sec-name')), text(li.querySelector('.sec-tag')), text(li.querySelector('.sec-num'))]);
    eq(secs, [['我的單字', '新牌組', '2 張'], ['動物', '新牌組', '2 張'], ['範例・高中常用單字', '加入現有', '1 張（重複 1）']], 'per-section summary');
    eq($$('.preview-cards .pw').map(text), ['alpha', 'beta', 'cat', 'dog', 'zebra crossing'], 'first 5 cards previewed');
    eq(text($('.preview-cards li .pp')), '/ˈælfə/', 'phonetic in preview');
    const errs = $$('.error-list li').map((li) => [text(li.querySelector('.eline')), text(li.querySelector('.ereason')), li.querySelector('code').textContent]);
    eq(errs, [['第 4 行', '找不到「|」分隔符號，也沒有中文意思', 'this line has no separator'], ['第 5 行', '缺少單字', ' | 缺單字']], 'error list: line, reason, original text');
    ok(/無法辨識的 2 行/.test(text($('details.errors summary'))), 'collapsible error list');

    const nameInput = $('.import-deck-name');
    eq(nameInput && nameInput.value, '我的單字', 'pasted text → deck name 我的單字');
    setValue(nameInput, '測試牌組', 'deck name');
    eq(text($('.sections li .sec-name')), '測試牌組', 'renamed target in preview');

    click('import-confirm');
    await onScreen('home');
    ok(toasts().some((t) => t.indexOf('已匯入 5 張（3 個牌組）') >= 0), 'toast after import', JSON.stringify(toasts()));
    const s = S();
    eq(s.decks.map((d) => d.name), ['範例・高中常用單字', '測試牌組', '動物'], 'decks after import');
    eq(cardsOf(s, deckNamed(s, '測試牌組').id).map((c) => c.word), ['alpha', 'beta'], 'default section');
    eq(cardsOf(s, deckNamed(s, '動物').id).map(fieldsOf), [
      { word: 'cat', phonetic: '/kæt/', meaning: 'n. 貓' + String.fromCharCode(10) + 'n. 貓（重複）', example: '', exampleZh: '', note: '' },
      { word: 'dog', phonetic: '', meaning: 'n. 狗', example: 'The dog barked.', exampleZh: '狗叫了。', note: '備註文字' },
    ], '#deck: 動物 section (a repeated word is merged into the first card)');
    const sample = cardsOf(s, deckNamed(s, '範例・高中常用單字').id);
    eq(sample.length, 41, 'section merged into the existing deck of the same name');
    eq(sample[40].word, 'zebra crossing', 'new card appended');
    eq(cardWord(s, 'abandon').meaning, 'v. 拋棄；放棄', 'existing duplicate skipped (unchanged)');
    eq($$('.deck-row').length, 3, 'three deck rows');
    noAppErrors();
  });

      frame = document.createElement('iframe');
      frame.srcdoc = '<!doctype html><meta charset="utf-8"><div id="app"></div><div id="toasts"></div>' +
        '<script src="../core.js"><\/script><script>VC.version = "0.9"; parent.__dv.boots++;' +
        'caches.keys = function () { return Promise.resolve(["vocabcards-v9", "other-cache"]); };' +
        'caches.delete = function (k) { parent.__dv.deleted.push(k); return Promise.resolve(true); };' +
        'window.fetch = function (u, o) { parent.__dv.heads.push(u + " " + (o && o.method)); return ' +
        (online ? 'Promise.resolve(new Response("", { status: 200 }));' : 'Promise.reject(new TypeError("Failed to fetch"));') +
        ' };<\/script><script src="../app.js"><\/script>';
      stage.appendChild(frame);
      await waitFor(() => window.__dv.boots >= 1 && W().VCApp, 'app in a srcdoc frame');
    };
    try {
      await boot(false);
      await sleep(900);
      eq(window.__dv.heads, ['core.js HEAD'], 'asks the server first (a HEAD request, which the service worker lets through)');
      eq([window.__dv.deleted, window.__dv.boots], [[], 1], 'no answer: no cache deleted, no reload');
      ok(toasts().some((t) => /有新版本/.test(t)), 'no answer: 「有新版本」 toast', JSON.stringify(toasts()));
      await boot(true);

      eq(window.__dv.deleted, ['vocabcards-v9'], 'server answers: the app caches are deleted, then the page reloads');
      await sleep(800);
      eq(window.__dv.boots, 2, 'reloads only once');
    } finally {
      sessionStorage.removeItem(FLAG);
      localStorage.removeItem('vocabcards.v1');
      if (frame) { frame.remove(); frame = null; }
    }
  });

    click('download-raw');
    await waitFor(() => captured.length === 1, 'download');
    eq((await captured[0].blob.text()) === raw, true, 'download = the unreadable data');
    click('delete-corrupt-copy');
    eq(await modalAnswer(true), '刪除損壞的舊資料？', 'delete confirm');
    await sleep(30);
    eq(copies().length, 0, 'copy deleted');
    ok(!$('#home-notice'), 'notice gone');
    localStorage.setItem(sk + '.corrupt-123', 'junk');
    click('open-settings');
    await onScreen('settings');
    click('clear-all');
    await modalAnswer(true);
    await modalAnswer(true);
    await overlaysGone();
    eq(copies().length, 0, '清除所有資料 removes copies too');
    noAppErrors();
  });

  test('a restore that cannot be saved still saves earlier answers (DS-7)', async function () {
    const sk = await openApp({ clock: T0 });
    const pad = '長'.repeat(140);
    const many = Array.from({ length: 1400 }, (_, i) => 'w' + i + ' | n. 第 ' + i + ' 個字 ' + pad + ' | Example sentence number ' + i + '. | 例句 ' + i).join('\n');
    W().VCApp.importText(many, { deckName: '很多字' });
    try {
      ok(localStorage.getItem(sk).length > 500000, 'big collection: saves are batched (2 s)');
      await openDeck(deckNamed(S(), '很多字').id);
      click('hub-choice');
      await onScreen('quiz');
      const id = quizCardId();
      click('option-' + correctIndex());
      W().location.hash = '#/import';
      await onScreen('import');
      const backup = { app: 'vocabcards', version: 1, data: { version: 1, seq: 0, days: {}, prefs: {},
        decks: [{ id: 'b1', name: '大備份', created: T0 }],
        cards: Array.from({ length: 2500 }, (_, i) => ({ id: 'c' + i, deckId: 'b1', word: 'big' + i, meaning: pad + i, state: 'new' })) } };
      setFiles($('#file-input'), [makeFile([JSON.stringify(backup)], 'backup.json', 'application/json')]);
      await waitFor(modalOpen, 'restore dialog');
      const release = fillStorage(20000);
      try {
        await modalAnswer(true);
        ok(toasts().some((t) => /沒有還原/.test(t)), 'restore refused', JSON.stringify(toasts()));
      } finally {
        release();
      }
      const rightOf = () => JSON.parse(localStorage.getItem(sk)).cards.find((c) => c.id === id).right;
      eq(rightOf(), 0, 'the answer is not saved yet');
      await sleep(2600);
      eq(rightOf(), 1, 'the earlier answer is saved after the failed restore');
    } finally {
      W().VCApp.setState({ version: 2, decks: [], cards: [], seq: 0, prefs: {} }); // free the space
    }
    noAppErrors();
  });

  test('release: versions match; the service worker caches every app file', async function () {
    await openApp({ clock: T0 });
    eq(VC().version, '2.0', 'core.js VC.version');
    click('open-settings');
    await onScreen('settings');
    ok(new RegExp('版本\\s*' + VC().version.replace('.', '\\.')).test(text($('main'))), 'settings shows APP_VERSION = VC.version');
    const get = async (f) => (await fetch('../' + f, { cache: 'no-store' })).text();
    const sw = await get('sw.js');
    ok(/const CACHE = 'vocabcards-v4';/.test(sw), 'service worker cache vocabcards-v4');
    const html = await get('index.html');
    const refs = Array.from(html.matchAll(/(?:src|href)="([^"#:]+)"/g)).map((m) => m[1]);
    ok(refs.length >= 6, 'index.html refs', JSON.stringify(refs));
    refs.forEach((r) => ok(sw.indexOf("'" + r + "'") >= 0, 'precached: ' + r));
    const manifest = JSON.parse(await get('manifest.webmanifest'));
    manifest.icons.forEach((i) => ok(sw.indexOf("'" + i.src + "'") >= 0, 'precached: ' + i.src));
    ok(sw.indexOf("'./'") >= 0, 'precached: ./');
    ok(!/複習|記憶程度/.test(manifest.description), 'manifest description: no spaced-repetition wording', manifest.description);
    ok(!/Anki|複習/.test(html), 'index.html: no spaced-repetition wording');
    noAppErrors();
  });

  /* ------------------------------------------------------------------ runner */
  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('test timed out after ' + ms + ' ms')), ms))]);
  }

  function report() {
    const lines = ['RESULT: PASS ' + pass + ' FAIL ' + fail, ''];
    failures.forEach((f) => {
      lines.push('FAIL ' + f.name + (f.label ? ' — ' + f.label : ''));
      String(f.detail).split('\n').forEach((l) => lines.push('    ' + l));
    });
    if (failures.length) lines.push('');
    summary.forEach((l) => lines.push(l));
    out.textContent = lines.join('\n');
    out.className = fail ? 'fail' : 'pass';
    document.title = lines[0];
  }

  async function run() {
    const only = new URLSearchParams(location.search).get('only');
    const selected = only ? tests.filter((t) => t.name.indexOf(only) >= 0) : tests;
    for (const t of selected) {
      current = t.name;
      const before = fail;
      const checks = pass + fail;
      try {
        await withTimeout(t.fn(), TEST_TIMEOUT);
      } catch (e) {
        record(false, 'threw', String((e && e.stack) || e));
      }
      summary.push((fail > before ? 'not ok ' : 'ok     ') + t.name + '  (' + (pass + fail - checks) + ' checks)');
      out.textContent = 'RUNNING ' + summary.length + '/' + selected.length;
    }
    if (frame) { frame.remove(); frame = null; }
    report();
  }

  run().catch((e) => { record(false, 'runner crashed', String((e && e.stack) || e)); report(); });
})();
</script>
